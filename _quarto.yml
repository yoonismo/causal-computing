  # title: "Causal Inference with Scientific Computing"
  title: "Data Science Computing for Economics"
  site-url: "https://yoonismo.github.io/causal-computing/"
  page-navigation: true
  navbar:
    left:
      - text: "Home"
        href: index.qmd
    right:
      - text: "Yoon Choi"
        href: "https://yoonismo.github.io"
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Introduction"
        href: index.qmd
      - section: "Installation"
        href: installation/index.qmd
        contents:
          - text: "macOS"
            href: installation/macos.qmd
          - text: "Windows"
            href: installation/windows.qmd
      - text: "Week 1: Tools of Reproducible Work"
        href: week1.qmd
      - text: "Week 2: Random Experiments make life easy"
        href: week2.qmd
      - text: "Week 3: Observational Studies - Subclassification and Matching"
        href: week3.qmd
