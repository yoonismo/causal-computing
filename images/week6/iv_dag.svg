<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img" aria-label="Instrumental variable diagram: Z causes D, D causes Y, and an unobserved U causes both D and Y; Z is not connected to U." xmlns:c2pa="http://c2pa.org/manifest">
  <title>Instrumental variable diagram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444441"/>
    </marker>
    <marker id="arr-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d85a30"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="519" height="249" rx="10" fill="#ffffff" stroke="#e1e0d9"/>

  <!-- arrows -->
  <line x1="111" y1="80" x2="226" y2="80" stroke="#444441" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="294" y1="80" x2="409" y2="80" stroke="#444441" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="320" y1="166" x2="279" y2="105" stroke="#d85a30" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr-u)"/>
  <line x1="360" y1="166" x2="401" y2="105" stroke="#d85a30" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr-u)"/>

  <!-- nodes -->
  <g font-family="'Times New Roman', Times, serif" font-style="italic" font-size="30" text-anchor="middle">
    <circle cx="80" cy="80" r="30" fill="#e6f1fb" stroke="#185fa5" stroke-width="2"/>
    <text x="80" y="90" fill="#0c447c">Z</text>
    <circle cx="260" cy="80" r="30" fill="#f1efe8" stroke="#5f5e5a" stroke-width="2"/>
    <text x="260" y="90" fill="#2c2c2a">D</text>
    <circle cx="440" cy="80" r="30" fill="#f1efe8" stroke="#5f5e5a" stroke-width="2"/>
    <text x="440" y="90" fill="#2c2c2a">Y</text>
    <circle cx="340" cy="190" r="30" fill="#faece7" stroke="#d85a30" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="340" y="200" fill="#712b13">U</text>
  </g>

  <!-- captions -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5f5e5a">
    <text x="80" y="36">instrument</text>
    <text x="80" y="134">draft eligibility</text>
    <text x="260" y="36">treatment</text>
    <text x="260" y="134" text-anchor="end" dx="-8">military service</text>
    <text x="440" y="36">outcome</text>
    <text x="440" y="134">earnings</text>
    <text x="340" y="238">unobserved (ability, motivation, …)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
